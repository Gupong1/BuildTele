name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'ZIP file name'
        required: true
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'
      android_sdk:
        description: 'Android SDK API level (contoh: 34, 35) - kosongkan untuk default'
        required: false
        default: ''
      android_ndk:
        description: 'Android NDK version (contoh: 26.1.10909125) - kosongkan untuk default'
        required: false
        default: ''
      java_version:
        description: 'Java version (contoh: 17, 21) - kosongkan untuk default 17'
        required: false
        default: '17'
      flutter_version:
        description: 'Flutter version (contoh: 3.24.0, 3.22.0) - kosongkan untuk default'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ github.event.inputs.java_version || '17' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ github.event.inputs.java_version || '17' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "${{ github.event.inputs.zip_file }}" -d project
          echo "✅ Project extracted"

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          PUBSPEC=$(find project -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo "📁 Struktur folder:"
            find project -maxdepth 3 -type d
            find project -maxdepth 3 -type f
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "✅ Project ditemukan di: $DIR"

      - name: Detect Android SDK & NDK from project
        id: detect_sdk_ndk
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          echo "🔍 Scanning project for SDK/NDK requirements..."
          
          DETECTED_SDK=""
          DETECTED_NDK=""
          
          # Cari compileSdk / targetSdk di build.gradle / build.gradle.kts
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | head -n 20); do
            SDK=$(grep -oE 'compileSdk(Version)?\s*=?\s*[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
            if [ -n "$SDK" ] && [ -z "$DETECTED_SDK" ]; then
              DETECTED_SDK="$SDK"
            fi
            NDK=$(grep -oE 'ndkVersion\s*=?\s*["'"'"'][0-9.]+["'"'"']' "$f" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
            if [ -n "$NDK" ] && [ -z "$DETECTED_NDK" ]; then
              DETECTED_NDK="$NDK"
            fi
          done
          
          # Cek local.properties
          if [ -f "android/local.properties" ]; then
            SDK2=$(grep -E 'sdk.dir' android/local.properties | head -n 1)
            echo "📄 local.properties: $SDK2"
          fi
          
          echo "detected_sdk=$DETECTED_SDK" >> $GITHUB_OUTPUT
          echo "detected_ndk=$DETECTED_NDK" >> $GITHUB_OUTPUT
          
          echo "📱 Detected compileSdk: ${DETECTED_SDK:-not found}"
          echo "🔧 Detected ndkVersion: ${DETECTED_NDK:-not found}"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install required SDK Platform & Build Tools
        run: |
          INPUT_SDK="${{ github.event.inputs.android_sdk }}"
          DETECTED_SDK="${{ steps.detect_sdk_ndk.outputs.detected_sdk }}"
          
          # Prioritas: input user > detected dari project > default
          if [ -n "$INPUT_SDK" ]; then
            SDK_API="$INPUT_SDK"
          elif [ -n "$DETECTED_SDK" ]; then
            SDK_API="$DETECTED_SDK"
          else
            SDK_API="34"
          fi
          
          echo "📦 Installing SDK Platform: android-$SDK_API"
          echo "📦 Installing Build Tools: 34.0.0, 35.0.0"
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          sdkmanager "platforms;android-${SDK_API}" || true
          sdkmanager "platforms;android-34" || true
          sdkmanager "platforms;android-35" || true
          sdkmanager "build-tools;34.0.0" || true
          sdkmanager "build-tools;35.0.0" || true
          sdkmanager "platform-tools" || true
          
          echo "✅ SDK Platform installed"
          sdkmanager --list_installed 2>/dev/null || true

      - name: Install required NDK
        run: |
          INPUT_NDK="${{ github.event.inputs.android_ndk }}"
          DETECTED_NDK="${{ steps.detect_sdk_ndk.outputs.detected_ndk }}"
          
          # Prioritas: input user > detected dari project
          if [ -n "$INPUT_NDK" ]; then
            NDK_VER="$INPUT_NDK"
          elif [ -n "$DETECTED_NDK" ]; then
            NDK_VER="$DETECTED_NDK"
          else
            NDK_VER=""
          fi
          
          if [ -z "$NDK_VER" ]; then
            echo "ℹ️ NDK tidak diperlukan (tidak ada requirement di project & input kosong)"
            exit 0
          fi
          
          echo "📦 Installing NDK: $NDK_VER"
          sdkmanager "ndk;${NDK_VER}" || {
            echo "⚠️ NDK $NDK_VER gagal diinstall langsung, mencoba versi lain..."
            # Fallback ke NDK versi umum
            sdkmanager "ndk;26.1.10909125" || true
            sdkmanager "ndk;25.2.9519653" || true
          }
          
          # Set ANDROID_NDK_HOME
          if [ -d "$ANDROID_HOME/ndk/${NDK_VER}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
            echo "✅ NDK ${NDK_VER} installed & env set"
          else
            echo "⚠️ NDK path tidak ditemukan, skip env"
          fi

      - name: Show Android SDK / NDK state
        run: |
          echo "════════════════════════════════"
          echo "📱 ANDROID_HOME: $ANDROID_HOME"
          echo "🔧 ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "☕ JAVA_HOME: $JAVA_HOME"
          echo "════════════════════════════════"
          echo "Installed SDK Platforms:"
          ls $ANDROID_HOME/platforms 2>/dev/null || echo "  (none)"
          echo "Installed NDK:"
          ls $ANDROID_HOME/ndk 2>/dev/null || echo "  (none)"
          echo "Installed Build Tools:"
          ls $ANDROID_HOME/build-tools 2>/dev/null || echo "  (none)"
          echo "════════════════════════════════"

      - name: Flutter pub get
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Flutter clean (optional)
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter clean || true

      - name: Flutter pub get (after clean)
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release --no-tree-shake-icons || {
              echo "⚠️ Build release gagal, retry tanpa --no-tree-shake-icons..."
              flutter build apk --release
            }
          else
            echo "🐞 Building DEBUG APK..."
            flutter build apk --debug
          fi

      - name: Check APK output
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          echo "📁 Checking APK output..."
          ls -lah build/app/outputs/flutter-apk/ || {
            echo "❌ Folder APK output tidak ditemukan!"
            find . -name "*.apk" -type f
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ github.event.inputs.build_type }}
          path: ${{ steps.find_pubspec.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14