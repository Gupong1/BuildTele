name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'ZIP file name'
        required: true
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'
      android_sdk:
        description: 'Android SDK API level (contoh: 34, 35, 36) - kosongkan untuk auto-detect'
        required: false
        default: ''
      android_ndk:
        description: 'Android NDK version - kosongkan untuk auto-detect'
        required: false
        default: ''
      java_version:
        description: 'Java version (contoh: 17, 21) - default 17'
        required: false
        default: '17'
      flutter_version:
        description: 'Flutter version (contoh: 3.24.0) - kosongkan untuk latest stable'
        required: false
        default: ''
      gradle_version:
        description: 'Gradle version (contoh: 8.14.0) - kosongkan untuk auto-fix'
        required: false
        default: ''
      agp_version:
        description: 'Android Gradle Plugin version (contoh: 8.7.0) - kosongkan untuk auto-fix'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ github.event.inputs.java_version || '17' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ github.event.inputs.java_version || '17' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "${{ github.event.inputs.zip_file }}" -d project
          echo "✅ Project extracted"

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          PUBSPEC=$(find project -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "✅ Project ditemukan di: $DIR"

      - name: Detect Android SDK & NDK from project
        id: detect_sdk_ndk
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          DETECTED_SDK=""
          DETECTED_NDK=""
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | head -n 20); do
            SDK=$(grep -oE 'compileSdk(Version)?\s*=?\s*[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
            if [ -n "$SDK" ] && [ -z "$DETECTED_SDK" ]; then DETECTED_SDK="$SDK"; fi
            NDK=$(grep -oE 'ndkVersion\s*=?\s*["'"'"'][0-9.]+["'"'"']' "$f" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
            if [ -n "$NDK" ] && [ -z "$DETECTED_NDK" ]; then DETECTED_NDK="$NDK"; fi
          done
          echo "detected_sdk=$DETECTED_SDK" >> $GITHUB_OUTPUT
          echo "detected_ndk=$DETECTED_NDK" >> $GITHUB_OUTPUT
          echo "📱 Detected compileSdk: ${DETECTED_SDK:-not found}"
          echo "🔧 Detected ndkVersion: ${DETECTED_NDK:-not found}"

      - name: 🔧 Auto-Fix Gradle Version & AGP
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          echo "════════════════════════════════════"
          echo "🔧 Auto-Fix Gradle & AGP"
          echo "════════════════════════════════════"

          # === 1. FIX GRADLE WRAPPER ===
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            OLD_GRADLE=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER" | head -n 1 | sed 's/gradle-//')
            echo "📌 Gradle lama: $OLD_GRADLE"

            # Tentukan target Gradle
            INPUT_GRADLE="${{ github.event.inputs.gradle_version }}"
            if [ -n "$INPUT_GRADLE" ]; then
              TARGET_GRADLE="$INPUT_GRADLE"
            else
              TARGET_GRADLE="8.14.0"
            fi

            echo "🎯 Target Gradle: $TARGET_GRADLE"

            # Cek apakah perlu upgrade
            if [ "$OLD_GRADLE" != "$TARGET_GRADLE" ]; then
              echo "⬆️ Upgrade Gradle $OLD_GRADLE → $TARGET_GRADLE"
              sed -i "s|gradle-$OLD_GRADLE-\(all\|bin\).zip|gradle-${TARGET_GRADLE}-all.zip|" "$WRAPPER"
              echo "✅ Gradle wrapper updated"
            else
              echo "ℹ️ Gradle sudah versi $TARGET_GRADLE"
            fi

            echo "📄 Isi gradle-wrapper.properties:"
            cat "$WRAPPER"
          else
            echo "⚠️ File $WRAPPER tidak ditemukan, skip."
          fi

          # === 2. FIX AGP (Android Gradle Plugin) ===
          echo ""
          echo "🔧 Cek AGP version..."
          INPUT_AGP="${{ github.event.inputs.agp_version }}"

          # Cari AGP di settings.gradle.kts / build.gradle.kts / settings.gradle / build.gradle
          for f in android/settings.gradle.kts android/settings.gradle android/build.gradle.kts android/build.gradle; do
            if [ -f "$f" ]; then
              echo "📄 File: $f"
              cat "$f" | head -n 40
              echo "---"

              # Auto-fix AGP jika target ditentukan
              if [ -n "$INPUT_AGP" ]; then
                sed -i -E "s|com\.android\.application[^:]*:[0-9]+\.[0-9]+(\.[0-9]+)?|com.android.application:$INPUT_AGP|g" "$f" || true
                sed -i -E "s|com\.android\.library[^:]*:[0-9]+\.[0-9]+(\.[0-9]+)?|com.android.library:$INPUT_AGP|g" "$f" || true
                sed -i -E "s|id\(\"com\.android\.application\"\) version \"[0-9]+\.[0-9]+(\.[0-9]+)?\"|id(\"com.android.application\") version \"$INPUT_AGP\"|g" "$f" || true
                echo "✅ AGP updated ke $INPUT_AGP (jika ditemukan)"
              fi
            fi
          done

          # === 3. FIX JAVA/KOTLIN JVM TARGET (opsional, aman) ===
          # Fix gradle.properties jika perlu
          if [ -f "android/gradle.properties" ]; then
            echo ""
            echo "📄 android/gradle.properties:"
            cat android/gradle.properties | head -n 30
          fi

          echo "════════════════════════════════════"
          echo "✅ Auto-fix selesai"
          echo "════════════════════════════════════"

      - name: Setup Android SDK (manual)
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT=$ANDROID_HOME
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          fi

          SDKMANAGER=""
          for path in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -f "$path" ]; then SDKMANAGER="$path"; break; fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager tidak ditemukan!"
            exit 1
          fi

          echo "✅ SDKMANAGER: $SDKMANAGER"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> $GITHUB_ENV
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "✅ SDK setup done"

      - name: Install required SDK Platform & Build Tools
        run: |
          INPUT_SDK="${{ github.event.inputs.android_sdk }}"
          DETECTED_SDK="${{ steps.detect_sdk_ndk.outputs.detected_sdk }}"
          if [ -n "$INPUT_SDK" ]; then SDK_API="$INPUT_SDK"
          elif [ -n "$DETECTED_SDK" ]; then SDK_API="$DETECTED_SDK"
          else SDK_API="34"; fi

          echo "📦 Installing SDK Platform: android-$SDK_API"
          "$SDKMANAGER_PATH" "platforms;android-${SDK_API}" > /dev/null 2>&1 || {
            echo "⚠️ Gagal install android-$SDK_API, fallback ke 34"
            SDK_API=34
            "$SDKMANAGER_PATH" "platforms;android-34" > /dev/null 2>&1 || true
          }
          "$SDKMANAGER_PATH" "platforms;android-34" > /dev/null 2>&1 || true
          "$SDKMANAGER_PATH" "build-tools;34.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER_PATH" "build-tools;35.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER_PATH" "build-tools;36.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER_PATH" "platform-tools" > /dev/null 2>&1 || true
          echo "✅ SDK Platform & Build Tools installed"

      - name: Install required NDK
        run: |
          INPUT_NDK="${{ github.event.inputs.android_ndk }}"
          DETECTED_NDK="${{ steps.detect_sdk_ndk.outputs.detected_ndk }}"
          if [ -n "$INPUT_NDK" ]; then NDK_VER="$INPUT_NDK"
          elif [ -n "$DETECTED_NDK" ]; then NDK_VER="$DETECTED_NDK"
          else NDK_VER=""; fi

          if [ -z "$NDK_VER" ]; then echo "ℹ️ NDK tidak diperlukan"; exit 0; fi
          echo "📦 Installing NDK: $NDK_VER"

          if "$SDKMANAGER_PATH" "ndk;${NDK_VER}" > /dev/null 2>&1; then
            echo "✅ NDK ${NDK_VER} installed"
          else
            for fallback in "28.2.13676358" "27.0.12077973" "26.3.11579264"; do
              if "$SDKMANAGER_PATH" "ndk;${fallback}" > /dev/null 2>&1; then
                NDK_VER="$fallback"; echo "✅ Fallback NDK $fallback"; break
              fi
            done
          fi

          if [ -d "$ANDROID_HOME/ndk/${NDK_VER}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: Setup local.properties
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          if [ -f "android/local.properties" ]; then
            grep -v "^sdk.dir=" android/local.properties > android/local.properties.tmp || true
            mv android/local.properties.tmp android/local.properties
          fi
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "✅ local.properties updated"

      - name: Flutter pub get
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Flutter clean
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter clean || true

      - name: Flutter pub get (after clean)
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release --no-tree-shake-icons || {
              echo "⚠️ Retry tanpa --no-tree-shake-icons..."
              flutter build apk --release
            }
          else
            echo "🐞 Building DEBUG APK..."
            flutter build apk --debug
          fi

      - name: Check APK output
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          ls -lah build/app/outputs/flutter-apk/ || {
            echo "❌ Folder APK output tidak ditemukan!"
            find . -name "*.apk" -type f
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ github.event.inputs.build_type }}
          path: ${{ steps.find_pubspec.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14