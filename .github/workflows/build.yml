name: Auto Build Android (Trigger, Debug & Release)

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih jenis build (debug/release/both)'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Sesuaikan dengan versi gradle Anda (11, 17, atau 21)

      - name: Auto Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (Auto Detect/Latest)
        run: |
          echo "Mencari dan memasang NDK..."
          sdkmanager --install "ndk;25.2.9519653" # Ganti versi jika Anda butuh versi spesifik NDK
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Validasi dan Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Jadikan Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Aplikasi (Debug)
        if: |
          github.event_name == 'push' || 
          github.event_name == 'pull_request' || 
          github.event.inputs.build_type == 'debug' || 
          github.event.inputs.build_type == 'both'
        run: ./gradlew assembleDebug

      - name: Build Aplikasi (Release)
        if: |
          github.event_name == 'push' || 
          github.event_name == 'pull_request' || 
          github.event.inputs.build_type == 'release' || 
          github.event.inputs.build_type == 'both'
        run: ./gradlew assembleRelease

      - name: Upload Artifact APK Debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Artifact APK Release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release
          path: app/build/outputs/apk/release/*.apk
