name: Android Auto Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      zip_file:
        description: 'Nama file ZIP (kosongkan kalau project sudah ada di repo)'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version (kosongkan = stable terbaru)'
        required: false
        default: ''
      java_version:
        description: 'Java version (kosongkan = auto: 17)'
        required: false
        default: ''
      gradle_version:
        description: 'Gradle version (kosongkan = auto)'
        required: false
        default: ''
      agp_version:
        description: 'AGP version (kosongkan = auto)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ============================================================
      # STEP 1: Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: Tentukan build type (default "release" untuk push/PR)
      # ============================================================
      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BT="${{ github.event.inputs.build_type }}"
          else
            BT="release"
          fi
          echo "build_type=$BT" >> $GITHUB_OUTPUT
          echo "✅ Build type: $BT"

      # ============================================================
      # STEP 3: Deteksi tipe project (Flutter / Android native / ZIP)
      # ============================================================
      - name: Detect project type & location
        id: detect_project
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 Deteksi tipe project"
          echo "════════════════════════════════════════"

          # --- Auto extract ZIP jika diminta ---
          ZIP_INPUT="${{ github.event.inputs.zip_file }}"
          if [ -n "$ZIP_INPUT" ] && [ -f "$ZIP_INPUT" ]; then
            echo "📦 Extracting ZIP: $ZIP_INPUT"
            mkdir -p extracted
            unzip -o "$ZIP_INPUT" -d extracted
          fi

          # --- Cari project root (yang punya pubspec.yaml atau settings.gradle) ---
          SEARCH_DIRS=". extracted"

          FLUTTER_PROJECT=""
          ANDROID_PROJECT=""

          for BASE in $SEARCH_DIRS; do
            [ -d "$BASE" ] || continue

            # Flutter project?
            if [ -z "$FLUTTER_PROJECT" ]; then
              PUBSPEC=$(find "$BASE" -maxdepth 5 -name "pubspec.yaml" \
                -not -path "*/build/*" -not -path "*/.dart_tool/*" 2>/dev/null | head -n 1)
              if [ -n "$PUBSPEC" ]; then
                FLUTTER_PROJECT=$(dirname "$PUBSPEC")
              fi
            fi

            # Android native project?
            if [ -z "$ANDROID_PROJECT" ]; then
              SETTINGS=$(find "$BASE" -maxdepth 5 -name "settings.gradle" -o -maxdepth 5 -name "settings.gradle.kts" 2>/dev/null \
                | grep -v "/build/" | head -n 1)
              if [ -n "$SETTINGS" ]; then
                ANDROID_PROJECT=$(dirname "$SETTINGS")
              fi
            fi
          done

          if [ -n "$FLUTTER_PROJECT" ]; then
            echo "✅ Flutter project: $FLUTTER_PROJECT"
            echo "project_type=flutter" >> $GITHUB_OUTPUT
            echo "project_dir=$FLUTTER_PROJECT" >> $GITHUB_OUTPUT
          elif [ -n "$ANDROID_PROJECT" ]; then
            echo "✅ Android native project: $ANDROID_PROJECT"
            echo "project_type=android" >> $GITHUB_OUTPUT
            echo "project_dir=$ANDROID_PROJECT" >> $GITHUB_OUTPUT
          else
            echo "❌ Tidak menemukan project Flutter maupun Android!"
            echo "Isi direktori:"
            ls -la
            find . -maxdepth 3 -name "*.gradle*" 2>/dev/null | head
            exit 1
          fi

      # ============================================================
      # STEP 4: Setup Java (dari input / default 17)
      # ============================================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ github.event.inputs.java_version || '17' }}
          cache: 'gradle'

      # ============================================================
      # STEP 5: Setup Flutter (hanya jika project Flutter)
      # ============================================================
      - name: Setup Flutter
        if: steps.detect_project.outputs.project_type == 'flutter'
        id: flutter_setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        if: steps.detect_project.outputs.project_type == 'flutter'
        run: |
          flutter --version
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> $GITHUB_ENV

      # ============================================================
      # STEP 6: Deteksi requirement dari Flutter SDK (kalau ada)
      # ============================================================
      - name: 🔍 Detect required versions from Flutter SDK
        if: steps.detect_project.outputs.project_type == 'flutter'
        id: flutter_reqs
        run: |
          echo "🔍 Membaca requirement dari Flutter SDK..."

          GRADLE_MIN=""
          TEMPLATE_WRAPPER="$FLUTTER_ROOT/packages/flutter_tools/templates/app_shared/android.tmpl/gradle/wrapper/gradle-wrapper.properties.tmpl"
          if [ -f "$TEMPLATE_WRAPPER" ]; then
            GRADLE_MIN=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$TEMPLATE_WRAPPER" | head -n 1 | sed 's/gradle-//')
          fi
          [ -z "$GRADLE_MIN" ] && GRADLE_MIN="8.14.0"

          TEMPLATE_SETTINGS="$FLUTTER_ROOT/packages/flutter_tools/templates/app_shared/android.tmpl/settings.gradle.kts.tmpl"
          AGP_MIN=""
          KOTLIN_MIN=""
          if [ -f "$TEMPLATE_SETTINGS" ]; then
            AGP_MIN=$(grep -oE 'com\.android\.application["'"'"')]*\s*version\s*["'"'"'][0-9]+\.[0-9]+(\.[0-9]+)?' "$TEMPLATE_SETTINGS" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
            KOTLIN_MIN=$(grep -oE 'org\.jetbrains\.kotlin\.android["'"'"')]*\s*version\s*["'"'"'][0-9]+\.[0-9]+(\.[0-9]+)?' "$TEMPLATE_SETTINGS" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          fi
          [ -z "$AGP_MIN" ] && AGP_MIN="8.9.1"
          [ -z "$KOTLIN_MIN" ] && KOTLIN_MIN="2.1.0"

          echo "📌 Gradle min: $GRADLE_MIN"
          echo "📌 AGP min: $AGP_MIN"
          echo "📌 Kotlin min: $KOTLIN_MIN"

          echo "gradle_min=$GRADLE_MIN" >> $GITHUB_OUTPUT
          echo "agp_min=$AGP_MIN" >> $GITHUB_OUTPUT
          echo "kotlin_min=$KOTLIN_MIN" >> $GITHUB_OUTPUT

      # ============================================================
      # STEP 7: Deteksi versi dari project (SDK, NDK, Gradle, dll)
      # ============================================================
      - name: 🔍 Detect versions from project
        id: project_versions
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 Deteksi versi dari project"
          echo "════════════════════════════════════════"

          # Cari folder android/ (kalau Flutter, ada di dalam)
          if [ -d "android" ]; then
            ANDROID_DIR="android"
          else
            ANDROID_DIR="."
          fi
          echo "📁 Android dir: $ANDROID_DIR"

          DETECTED_SDK=""
          DETECTED_NDK=""
          DETECTED_MIN_SDK=""
          DETECTED_TARGET_SDK=""

          for f in $(find "$ANDROID_DIR" -maxdepth 6 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | grep -v "/build/"); do
            SDK=$(grep -oE 'compileSdk(Version)?\s*[=:]?\s*[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
            [ -n "$SDK" ] && [ -z "$DETECTED_SDK" ] && DETECTED_SDK="$SDK"

            NDK=$(grep -oE 'ndkVersion\s*[=:]?\s*["'"'"'][0-9.]+' "$f" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
            [ -n "$NDK" ] && [ -z "$DETECTED_NDK" ] && DETECTED_NDK="$NDK"

            MINSDK=$(grep -oE 'minSdk(Version)?\s*[=:]?\s*[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
            [ -n "$MINSDK" ] && [ -z "$DETECTED_MIN_SDK" ] && DETECTED_MIN_SDK="$MINSDK"

            TARGETSDK=$(grep -oE 'targetSdk(Version)?\s*[=:]?\s*[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
            [ -n "$TARGETSDK" ] && [ -z "$DETECTED_TARGET_SDK" ] && DETECTED_TARGET_SDK="$TARGETSDK"
          done

          # Fallback
          [ -z "$DETECTED_SDK" ] && DETECTED_SDK="34"

          echo "📱 compileSdk: $DETECTED_SDK"
          echo "🔧 ndkVersion: ${DETECTED_NDK:-not needed}"
          echo "📉 minSdk: ${DETECTED_MIN_SDK:-not found}"
          echo "🎯 targetSdk: ${DETECTED_TARGET_SDK:-not found}"

          echo "detected_sdk=$DETECTED_SDK" >> $GITHUB_OUTPUT
          echo "detected_ndk=$DETECTED_NDK" >> $GITHUB_OUTPUT
          echo "detected_min_sdk=$DETECTED_MIN_SDK" >> $GITHUB_OUTPUT
          echo "detected_target_sdk=$DETECTED_TARGET_SDK" >> $GITHUB_OUTPUT

      # ============================================================
      # STEP 8: Setup Android SDK (otomatis)
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Licenses accepted"

      # ============================================================
      # STEP 9: Install SDK Platform & Build Tools (auto)
      # ============================================================
      - name: Install SDK Platform & Build Tools
        run: |
          SDK_API="${{ steps.project_versions.outputs.detected_sdk }}"
          [ -z "$SDK_API" ] && SDK_API="34"
          echo "📦 Install platform: android-$SDK_API"

          sdkmanager "platforms;android-${SDK_API}" > /dev/null 2>&1 || {
            echo "⚠️ Fallback ke android-34"
            sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          }

          for BT in "${SDK_API}.0.0" "36.0.0" "35.0.0" "34.0.0"; do
            sdkmanager "build-tools;${BT}" > /dev/null 2>&1 || true
          done

          echo "✅ SDK Platform & Build Tools installed"

      # ============================================================
      # STEP 10: Install NDK (hanya kalau project butuh)
      # ============================================================
      - name: Install NDK (auto)
        run: |
          NDK_VER="${{ steps.project_versions.outputs.detected_ndk }}"
          if [ -z "$NDK_VER" ]; then
            echo "ℹ️ NDK tidak diperlukan (tidak ada ndkVersion di project)"
            exit 0
          fi

          echo "📦 Install NDK: $NDK_VER"
          if sdkmanager "ndk;${NDK_VER}" > /dev/null 2>&1; then
            echo "✅ NDK $NDK_VER installed"
          else
            for FB in "28.2.13676358" "27.2.12479018" "27.0.12077973" "26.3.11579264" "26.1.10909125"; do
              if sdkmanager "ndk;${FB}" > /dev/null 2>&1; then
                NDK_VER="$FB"
                echo "✅ Fallback NDK: $FB"
                break
              fi
            done
          fi

          if [ -d "$ANDROID_HOME/ndk/${NDK_VER}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
            echo "✅ NDK env diset"
          fi

      # ============================================================
      # STEP 11: Auto-Fix Gradle wrapper, AGP, Kotlin
      # ============================================================
      - name: 🔧 Auto-Fix Gradle, AGP, Kotlin
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        env:
          INPUT_GRADLE: ${{ github.event.inputs.gradle_version }}
          INPUT_AGP: ${{ github.event.inputs.agp_version }}
          GRADLE_MIN: ${{ steps.flutter_reqs.outputs.gradle_min }}
          AGP_MIN: ${{ steps.flutter_reqs.outputs.agp_min }}
          KOTLIN_MIN: ${{ steps.flutter_reqs.outputs.kotlin_min }}
          PROJECT_TYPE: ${{ steps.detect_project.outputs.project_type }}
        run: |
          echo "════════════════════════════════════════"
          echo "🔧 AUTO-FIX"
          echo "════════════════════════════════════════"

          # Default kalau bukan Flutter
          [ -z "$GRADLE_MIN" ] && GRADLE_MIN="8.14.0"
          [ -z "$AGP_MIN" ] && AGP_MIN="8.9.1"
          [ -z "$KOTLIN_MIN" ] && KOTLIN_MIN="2.1.0"

          # Override dari input
          [ -n "$INPUT_GRADLE" ] && GRADLE_MIN="$INPUT_GRADLE"
          [ -n "$INPUT_AGP" ] && AGP_MIN="$INPUT_AGP"

          echo "🎯 Target: Gradle=$GRADLE_MIN, AGP=$AGP_MIN, Kotlin=$KOTLIN_MIN"

          # Helper: v1 >= v2
          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          # Tentukan lokasi android dir
          if [ -d "android" ]; then ANDROID_DIR="android"; else ANDROID_DIR="."; fi

          # ---- 1. FIX GRADLE WRAPPER ----
          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            OLD_GRADLE=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER" | head -n 1 | sed 's/gradle-//')
            echo "📌 Gradle lama: ${OLD_GRADLE:-unknown}"

            TARGET_GRADLE="$GRADLE_MIN"
            if [ -n "$OLD_GRADLE" ] && version_gte "$OLD_GRADLE" "$GRADLE_MIN"; then
              TARGET_GRADLE="$OLD_GRADLE"
            fi

            if [ "$OLD_GRADLE" != "$TARGET_GRADLE" ]; then
              echo "⬆️ Update Gradle: $OLD_GRADLE → $TARGET_GRADLE"
              grep -v '^distributionUrl' "$WRAPPER" > "${WRAPPER}.tmp" || true
              echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-${TARGET_GRADLE}-all.zip" >> "${WRAPPER}.tmp"
              mv "${WRAPPER}.tmp" "$WRAPPER"
            else
              echo "ℹ️ Gradle sudah OK"
            fi

            VERIFY=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER" | head -n 1 | sed 's/gradle-//')
            echo "✅ Gradle final: $VERIFY"
            if ! version_gte "$VERIFY" "$GRADLE_MIN"; then
              echo "❌ Gradle masih < $GRADLE_MIN"
              cat "$WRAPPER"
              exit 1
            fi
          else
            echo "⚠️ gradle-wrapper.properties tidak ditemukan di $ANDROID_DIR"
          fi

          # ---- 2. FIX AGP & KOTLIN ----
          for f in \
            "$ANDROID_DIR/settings.gradle.kts" \
            "$ANDROID_DIR/settings.gradle" \
            "$ANDROID_DIR/build.gradle.kts" \
            "$ANDROID_DIR/build.gradle"; do
            [ -f "$f" ] || continue
            echo ""
            echo "🔧 Fix: $f"

            # AGP
            sed -i -E "s|com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?|com.android.tools.build:gradle:${AGP_MIN}|g" "$f"
            sed -i -E "s|com\.android\.application:[0-9]+\.[0-9]+(\.[0-9]+)?|com.android.application:${AGP_MIN}|g" "$f"
            sed -i -E "s|com\.android\.library:[0-9]+\.[0-9]+(\.[0-9]+)?|com.android.library:${AGP_MIN}|g" "$f"
            sed -i -E "s|id\(\"com\.android\.application\"\)\s*version\s*\"[0-9]+\.[0-9]+(\.[0-9]+)?\"|id(\"com.android.application\") version \"${AGP_MIN}\"|g" "$f"
            sed -i -E "s|id\('com\.android\.application'\)\s*version\s*'[0-9]+\.[0-9]+(\.[0-9]+)?'|id('com.android.application') version '${AGP_MIN}'|g" "$f"

            # Kotlin
            sed -i -E "s|org\.jetbrains\.kotlin[^:]*:[0-9]+\.[0-9]+(\.[0-9]+)?|org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_MIN}|g" "$f"
            sed -i -E "s|id\(\"org\.jetbrains\.kotlin\.android\"\)\s*version\s*\"[0-9]+\.[0-9]+(\.[0-9]+)?\"|id(\"org.jetbrains.kotlin.android\") version \"${KOTLIN_MIN}\"|g" "$f"
            sed -i -E "s|id\('org\.jetbrains\.kotlin\.android'\)\s*version\s*'[0-9]+\.[0-9]+(\.[0-9]+)?'|id('org.jetbrains.kotlin.android') version '${KOTLIN_MIN}'|g" "$f"

            echo "  ✅ AGP → $AGP_MIN, Kotlin → $KOTLIN_MIN"
          done

          # ---- 3. FIX gradle.properties ----
          GP="$ANDROID_DIR/gradle.properties"
          if [ -f "$GP" ]; then
            grep -q '^android.useAndroidX=' "$GP" || echo "android.useAndroidX=true" >> "$GP"
            grep -q '^android.enableJetifier=' "$GP" || echo "android.enableJetifier=true" >> "$GP"
            grep -q '^org.gradle.jvmargs=' "$GP" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G" >> "$GP"
            echo "✅ gradle.properties OK"
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "✅ AUTO-FIX SELESAI"
          echo "════════════════════════════════════════"

      # ============================================================
      # STEP 12: Setup local.properties
      # ============================================================
      - name: Setup local.properties
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          if [ -d "android" ]; then
            LP="android/local.properties"
          else
            LP="local.properties"
          fi

          # Hapus baris lama
          if [ -f "$LP" ]; then
            grep -v -E '^(sdk.dir|flutter.sdk|ndk.dir)=' "$LP" > "${LP}.tmp" || true
            mv "${LP}.tmp" "$LP"
          fi

          echo "sdk.dir=$ANDROID_HOME" >> "$LP"
          if [ -n "$FLUTTER_ROOT" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" >> "$LP"
          fi
          if [ -n "$ANDROID_NDK_HOME" ]; then
            echo "ndk.dir=$ANDROID_NDK_HOME" >> "$LP"
          fi

          echo "✅ $LP:"
          cat "$LP"

      # ============================================================
      # STEP 13: Build APK (Flutter)
      # ============================================================
      - name: Build APK - Flutter
        if: steps.detect_project.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          flutter pub get
          flutter clean || true
          flutter pub get

          BT="${{ steps.config.outputs.build_type }}"
          case "$BT" in
            release)
              echo "🚀 Build RELEASE..."
              flutter build apk --release --no-tree-shake-icons || flutter build apk --release
              ;;
            debug)
              echo "🐞 Build DEBUG..."
              flutter build apk --debug
              ;;
            both)
              echo "🚀 Build RELEASE..."
              flutter build apk --release --no-tree-shake-icons || flutter build apk --release
              echo "🐞 Build DEBUG..."
              flutter build apk --debug
              ;;
          esac

      # ============================================================
      # STEP 14: Build APK (Android Native)
      # ============================================================
      - name: Build APK - Android Native
        if: steps.detect_project.outputs.project_type == 'android'
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true

          BT="${{ steps.config.outputs.build_type }}"
          case "$BT" in
            release)
              echo "🚀 Build RELEASE..."
              ./gradlew assembleRelease --no-daemon
              ;;
            debug)
              echo "🐞 Build DEBUG..."
              ./gradlew assembleDebug --no-daemon
              ;;
            both)
              echo "🚀 Build RELEASE..."
              ./gradlew assembleRelease --no-daemon
              echo "🐞 Build DEBUG..."
              ./gradlew assembleDebug --no-daemon
              ;;
          esac

      # ============================================================
      # STEP 15: Cek output APK
      # ============================================================
      - name: Check APK output
        id: apk_check
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          echo "🔍 Mencari file APK..."
          APK_LIST=$(find . -type f -name "*.apk" 2>/dev/null | grep -v "/\.gradle/" || true)

          if [ -z "$APK_LIST" ]; then
            echo "❌ Tidak ada APK yang dihasilkan!"
            echo "Isi folder build (jika ada):"
            find . -type d -name "outputs" 2>/dev/null | head
            exit 1
          fi

          echo "✅ APK ditemukan:"
          echo "$APK_LIST"
          echo "apk_list<<EOF" >> $GITHUB_OUTPUT
          echo "$APK_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ============================================================
      # STEP 16: Upload APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.config.outputs.build_type }}-${{ github.run_number }}
          path: |
            ${{ steps.detect_project.outputs.project_dir }}/**/*.apk
            !**/.gradle/**
          if-no-files-found: error
          retention-days: 14