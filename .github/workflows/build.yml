name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'ZIP file name'
        required: true
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "${{ github.event.inputs.zip_file }}" -d project

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          PUBSPEC=$(find project -name "pubspec.yaml" -maxdepth 3 | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "✅ Project ditemukan di: $DIR"

      - name: Flutter pub get
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ steps.find_pubspec.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
