name: Android Auto Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Sesuaikan dengan versi Java utama proyek Anda
        cache: 'gradle'

    - name: Setup Android SDK & NDK Otomatis
      uses: android-actions/setup-android@v3
      with:
        # Mengizinkan GitHub Actions membaca versi target SDK dari build.gradle otomatis
        packages: 'tools' 

    - name: Install NDK Otomatis (Jika Diperlukan)
      # Langkah ini akan mencari folder ndkVersion di build.gradle atau local.properties.
      # Plugin Android Gradle (AGP) versi 4.1 ke atas otomatis mendownload versi NDK yang tepat.
      run: |
        if grep -q "ndkVersion" app/build.gradle*; then
          NDK_VER=$(grep "ndkVersion" app/build.gradle* | sed -E 's/.*"([^"]+)".*/\1/' | sed -E "s/.*'([^']+)'.*/\1/")
          echo "Mendownload NDK versi: $NDK_VER"
          sdkmanager --install "ndk;$NDK_VER"
        else
          echo "ndkVersion tidak ditentukan secara spesifik, mengandalkan AGP default."
        fi

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    - name: Build APK (Release)
      # Menjalankan Gradle Wrapper bawaan proyek secara otomatis
      run: ./gradlew assembleRelease
